baseURL = "https://hoggerfodder.github.io/"
languageCode = "en-au"
title = "Hogger Fodder"
enableRobotsTXT = true
timeZone = "UTC"

# Posts live in content/posts/YYYY-MM-DD-slug/index.md and are served at /posts/slug/
[permalinks]
  posts = "/posts/:slug/"

[params]
  mainSections = ["posts"]
  tagline = "Food for thought from Azeroth"
  description = "Exploring the economics and maths behind the WoW mechanics, from first principles."
  author = "Hoggerfodder"
  kofi = "https://ko-fi.com/hoggerfodder"
  github = "https://github.com/hoggerfodder/hoggerfodder.github.io"
  # giscus: fill these in from https://giscus.app after choosing the repo and a Discussions category.
  [params.giscus]
    repo = "hoggerfodder/hoggerfodder.github.io"
    repoId = ""
    category = "General"
    categoryId = ""

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # allow raw HTML in posts: <details>, <iframe>
  [markup.goldmark.extensions.passthrough]
    enable = true          # leave $...$ and $$...$$ alone for KaTeX
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 20

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Mechanisms"
    pageRef = "/mechanisms"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30
  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 40

# Treat only Markdown as content, so a .html file inside a post folder (an interactive
# like the ruler) is published as-is next to the post instead of being parsed as a page.
[contentTypes]
  [contentTypes."text/markdown"]
