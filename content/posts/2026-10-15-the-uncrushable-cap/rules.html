<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Four ways to fit a point of dodge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b665e; --rule: #e4e0d8; --box: #f3efe7; --accent: #8a5a2b;
    --miss: #2a78d6; --dodge: #1baf7a; --parry: #6250d6; --block: #008300; --rest: #c9c4ba;
    --ink-on-miss: #fff; --ink-on-dodge: #0b0b0b; --ink-on-parry: #fff; --ink-on-block: #fff; --ink-on-rest: #1f1d1a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --fg: #e6e1d8; --muted: #9b958b; --rule: #2d2b27; --box: #211f1b; --accent: #d4a06a;
      --miss: #3987e5; --dodge: #199e70; --parry: #9085e9; --block: #008300; --rest: #4a4740;
      --ink-on-dodge: #fff; --ink-on-rest: #e6e1d8;
    }
  }
  * { box-sizing: border-box; }
  html { overflow: hidden; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
  body { padding: .6rem .9rem .6rem; }
  .row { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; margin-bottom: .5rem; }
  .seg { display: inline-flex; gap: .25rem; align-items: center; border: 0; padding: 0; margin: 0; }
  .seg legend { float: left; font-size: .8rem; color: var(--muted); margin-right: .3rem; padding: 0; }
  .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
  .seg label { cursor: pointer; user-select: none; }
  .seg label span { display: inline-block; font-size: .85rem; border-radius: 999px; padding: .2rem .7rem; border: 1px solid var(--rule); background: var(--box); }
  .seg input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg.off { opacity: .45; }

  .rules { display: grid; grid-template-columns: 11.5rem 1fr; gap: .2rem .7rem; align-items: start; }
  .rules .name { font-size: .85rem; line-height: 1.25; height: 52px; overflow: hidden; }
  .rules .name, .rules .name small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rules .name small { display: block; color: var(--muted); font-size: .75rem; }
  .barwrap { position: relative; height: 52px; }
  .bar { position: relative; height: 28px; }
  .segm { position: absolute; top: 0; height: 100%; border-radius: 3px; overflow: hidden; white-space: nowrap;
          font-size: .74rem; line-height: 28px; padding: 0 .25rem; font-variant-numeric: tabular-nums; }
  .below { position: absolute; font-size: .7rem; color: var(--fg); font-variant-numeric: tabular-nums; transform: translateX(-50%); white-space: nowrap; line-height: 1; }
  .below::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 4px; background: var(--muted); }
  .segm b { font-weight: 600; }
  .axis { position: relative; height: 16px; grid-column: 2; }
  .tick { position: absolute; top: 0; width: 1px; height: 5px; background: var(--muted); }
  .tick span { position: absolute; top: 5px; left: 0; transform: translateX(-50%); font-size: .7rem; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .8rem; color: var(--muted); margin: .5rem 0 .4rem; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .3rem; vertical-align: -1px; }
  table { border-collapse: collapse; width: 100%; font-size: .82rem; margin-top: .3rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .15rem .4rem; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); }
  .note { font-size: .78rem; color: var(--muted); margin: .4rem 0 0; }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    .rules { grid-template-columns: 1fr; gap: .2rem; }
    .rules .name { margin-top: .3rem; height: auto; }
    .rules .name small { display: none; }
    .axis { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="row">
  <fieldset class="seg" id="items"><legend>Gear</legend></fieldset>
  <fieldset class="seg" id="order"><legend>Equipped</legend></fieldset>
</div>
<div class="rules" id="rules"></div>
<div class="legend" id="legend"></div>
<p class="note" id="note"></p>

<script>
// ---- the running example from the post --------------------------------------
const C = {
  sheet: { miss: 5, dodge: 8, parry: 5, block: 5 },     // what the character sheet says before any item
  items: [
    { key: 't', name: 'Mark of Tyranny', stat: 'dodge', bonus: 1 },
    { key: 'r', name: 'ring', stat: 'parry', bonus: 3 },
  ],
  outcomes: ['miss', 'dodge', 'parry', 'block', 'rest'],
  names: { miss: 'Miss', dodge: 'Dodge', parry: 'Parry', block: 'Block', rest: 'Everything else' },
  rules: [
    { key: 'seq',   name: 'Sequential coins',          sub: 'miss or not, then dodge or not, …' },
    { key: 'pro',   name: 'Scale everything',           sub: 'add the point, shrink all by 100/total' },
    { key: 'keep',  name: 'Keep the point, shrink the rest', sub: 'order of equipping matters' },
    { key: 'prio',  name: 'Last interval pays',         sub: 'what WoW does' },
  ],
};
// ------------------------------------------------------------------------------

const S = { items: { t: false, r: false }, order: 'tr' };
const $ = id => document.getElementById(id);
const fmt = x => (Math.round(x * 100) / 100).toFixed(2);
const four = ['miss', 'dodge', 'parry', 'block'];

function equipped() { return C.items.filter(i => S.items[i.key]); }
function sheetAfterItems() { const s = { ...C.sheet }; for (const i of equipped()) s[i.stat] += i.bonus; return s; }

function seqShares() {           // coins in order; each later outcome only sees what is left
  const s = sheetAfterItems(), out = {}; let left = 100;
  for (const k of four) { out[k] = left * s[k] / 100; left -= out[k]; }
  out.rest = left; return out;
}
function proShares() {           // every interval, including the remainder, scaled by the same factor
  const s = sheetAfterItems(); const claims = { ...s, rest: 100 - four.reduce((a, k) => a + C.sheet[k], 0) };
  const tot = C.outcomes.reduce((a, k) => a + claims[k], 0); const f = 100 / tot; const out = {};
  for (const k of C.outcomes) out[k] = claims[k] * f; return out;
}
function keepShares() {          // apply items one at a time; the boosted interval keeps its point, the others shrink to fit
  let p = { ...C.sheet, rest: 100 - four.reduce((a, k) => a + C.sheet[k], 0) };
  const seq = (S.order === 'tr' ? C.items : [...C.items].reverse()).filter(i => S.items[i.key]);
  for (const it of seq) {
    p[it.stat] += it.bonus;
    const others = C.outcomes.filter(k => k !== it.stat); const tot = others.reduce((a, k) => a + p[k], 0);
    const f = (100 - p[it.stat]) / tot; for (const k of others) p[k] *= f;
  }
  return p;
}
function prioShares() {          // intervals keep their sheet value; the last one takes what is left
  const s = sheetAfterItems(); const out = { ...s }; out.rest = 100 - four.reduce((a, k) => a + s[k], 0); return out;
}
const calc = { seq: seqShares, pro: proShares, keep: keepShares, prio: prioShares };

function render() {
  const host = $('rules'); host.innerHTML = '';
  const W = host.clientWidth || 600; const barW = Math.max(200, W - (window.innerWidth > 480 ? 11.5 * 15 + 11 : 0));
  const results = {};
  for (const r of C.rules) {
    const sh = results[r.key] = calc[r.key]();
    const name = document.createElement('div'); name.className = 'name';
    name.innerHTML = `${r.name}<small>${r.sub}</small>`; host.appendChild(name);
    const wrap = document.createElement('div'); wrap.className = 'barwrap';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', `${r.name}: ` + C.outcomes.map(k => `${C.names[k]} ${fmt(sh[k])}`).join(', '));
    let x = 0, belowRow = 0;
    for (const k of C.outcomes) {
      const w = sh[k]; if (w <= 0) continue;
      const el = document.createElement('div'); el.className = 'segm';
      el.style.left = `calc(${x}% + 1px)`; el.style.width = `calc(${w}% - 2px)`;
      el.style.background = `var(--${k})`; el.style.color = `var(--ink-on-${k})`;
      const px = w / 100 * barW;
      if (px >= 78) el.innerHTML = `<b>${C.names[k]}</b> ${fmt(w)}`;
      else if (px >= 32) { el.textContent = fmt(w); belowRow = 0; }
      else {   // too narrow: number under the bar, alternating rows so neighbours do not collide
        const b = document.createElement('div'); b.className = 'below'; b.textContent = fmt(w);
        b.style.left = (x + w / 2) + '%'; b.style.top = (32 + belowRow * 11) + 'px';
        wrap.appendChild(b); belowRow = 1 - belowRow;
      }
      el.title = `${C.names[k]} ${fmt(w)}`;
      bar.appendChild(el); x += w;
    }
    wrap.insertBefore(bar, wrap.firstChild); host.appendChild(wrap);
  }
  const ax = document.createElement('div'); ax.className = 'axis';
  for (let v = 0; v <= 100; v += 25) { const t = document.createElement('div'); t.className = 'tick'; t.style.left = v + '%'; t.innerHTML = `<span>${v}</span>`; ax.appendChild(t); }
  host.appendChild(ax);
  const sheetNow = sheetAfterItems();
  $('legend').innerHTML = C.outcomes.map(k => `<span><span class="sw" style="background:var(--${k})"></span>${C.names[k]}${k in sheetNow ? ` (sheet ${fmt(sheetNow[k])})` : ''}</span>`).join('');
  for (const i of C.items) document.querySelector(`#items input[value="${i.key}"]`).checked = S.items[i.key];
  document.querySelector(`#order input[value="${S.order}"]`).checked = true;
  const both = S.items.t && S.items.r;
  $('order').classList.toggle('off', !both);
  $('note').textContent = both
    ? 'Only the third rule changes when you swap the order. The other three land in the same place either way.'
    : equipped().length ? 'Equip the second item to see which rules care about the order.' : 'Nothing equipped: every rule agrees with the sheet.';
}

function build() {
  const it = $('items');
  for (const i of C.items) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" value="${i.key}"><span>${i.name} (+${i.bonus}% ${i.stat})</span>`;
    l.querySelector('input').onchange = e => { S.items[i.key] = e.target.checked; render(); };
    it.appendChild(l);
  }
  const od = $('order');
  for (const o of [{ v: 'tr', label: 'trinket first' }, { v: 'rt', label: 'ring first' }]) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="radio" name="order" value="${o.v}"${o.v === S.order ? ' checked' : ''}><span>${o.label}</span>`;
    l.querySelector('input').onchange = () => { S.order = o.v; render(); };
    od.appendChild(l);
  }
  window.addEventListener('resize', render);
}
build(); render();

// Tell the post page how tall this figure is, so the iframe fits it (no fixed height, no inner scrollbar).
(function () {
  if (window.parent === window) return;
  const report = () => parent.postMessage({ hfHeight: document.body.getBoundingClientRect().height }, '*');
  new ResizeObserver(report).observe(document.body);
  addEventListener('load', report);
})();
</script>
</body>
</html>
