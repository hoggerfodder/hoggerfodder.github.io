<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The ruler</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b665e; --rule: #e4e0d8; --box: #f3efe7; --accent: #8a5a2b;
    --miss: #2a78d6; --dodge: #1baf7a; --parry: #6250d6; --block: #008300; --crit: #e87ba4; --crush: #eda100; --hit: #c9c4ba;
    --ink-on-miss: #fff; --ink-on-dodge: #0b0b0b; --ink-on-parry: #fff; --ink-on-block: #fff; --ink-on-crit: #0b0b0b; --ink-on-crush: #0b0b0b; --ink-on-hit: #1f1d1a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --fg: #e6e1d8; --muted: #9b958b; --rule: #2d2b27; --box: #211f1b; --accent: #d4a06a;
      --miss: #3987e5; --dodge: #199e70; --parry: #9085e9; --block: #008300; --crit: #d55181; --crush: #c98500; --hit: #4a4740;
      --ink-on-dodge: #fff; --ink-on-crit: #fff; --ink-on-crush: #0b0b0b; --ink-on-hit: #e6e1d8;
    }
  }
  html { overflow: hidden; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
  body { padding: .75rem .9rem 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; margin-bottom: .6rem; }
  .presets button, .seg label {
    font: inherit; font-size: .85rem; color: var(--fg); background: var(--box); border: 1px solid var(--rule);
    border-radius: 999px; padding: .2rem .7rem; cursor: pointer; user-select: none;
  }
  .presets button:hover, .seg label:hover { border-color: var(--muted); }
  .seg { display: inline-flex; gap: .25rem; align-items: center; border: 0; padding: 0; margin: 0; }
  .seg legend { float: left; font-size: .8rem; color: var(--muted); margin-right: .3rem; padding: 0; }
  .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
  .seg input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seg label { padding: 0; }
  .seg label span { display: inline-block; border-radius: 999px; padding: .2rem .7rem; border: 1px solid transparent; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar-wrap { position: relative; margin: 2.4rem 0 2.4rem; }
  .lane { display: flex; align-items: center; gap: .45rem; }
  .lane + .lane { margin-top: 10px; }
  .lane-label { flex: none; width: 2.4rem; text-align: right; font-size: .72rem; color: var(--muted); }
  .bar { position: relative; height: 44px; flex: 1; }
  .bar.sheet { height: 18px; }
  .bar.sheet .segm { font-size: .7rem; line-height: 18px; padding: 0 .25rem; }
  .bar.sheet .mark { top: -4px; bottom: -4px; }
  .track { position: absolute; top: 0; height: 100%; left: 0; background: var(--box); border: 1px solid var(--rule); border-radius: 4px; }
  .track::after { content: ''; position: absolute; right: -1px; top: -36px; bottom: -8px; width: 2px; background: var(--fg); z-index: 1; }
  .segm { position: absolute; top: 0; height: 100%; border-radius: 3px; overflow: hidden; white-space: nowrap;
          font-size: .78rem; line-height: 44px; padding: 0 .35rem; cursor: default; }
  .segm.unpaid { opacity: .5; top: 10px; height: 28px; line-height: 28px; background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(0,0,0,.35) 4px 6px); }
  .segm b { font-weight: 600; }
  .mark { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--fg); transform: translateX(-50%); }
  .mark.thr { background: var(--accent); }
  .mark-label { position: absolute; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .mark-label.above { bottom: 100%; margin-bottom: 9px; }
  .mark-label.below { top: 100%; margin-top: 20px; }
  .mark-label.thr { color: var(--accent); }
  .mark-label.left { transform: translateX(-100%); padding-right: 4px; }
  .mark-label.right { padding-left: 4px; }
  .axis { position: relative; flex: 1; height: 14px; }
  .tick { position: absolute; top: 0; width: 1px; height: 5px; background: var(--muted); transform: translateX(-50%); }
  .tick span { position: absolute; top: 6px; left: 0; transform: translateX(-50%); font-size: .7rem; color: var(--muted); }
  .readout { margin: 0 0 .8rem; font-size: .92rem; }
  .readout strong { font-weight: 600; }

  .sliders { display: grid; grid-template-columns: 5.2rem 1fr 4.4rem; gap: .35rem .6rem; align-items: center; margin-bottom: .6rem; }
  .sliders label { font-size: .88rem; display: flex; align-items: center; gap: .4rem; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .sliders input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .sliders output, .sliders input[type=number] { font-variant-numeric: tabular-nums; font-size: .85rem; text-align: right; }
  .sliders input[type=number] { width: 100%; font: inherit; color: var(--fg); background: var(--box); border: 1px solid var(--rule); border-radius: 4px; padding: .1rem .3rem; }

  table { border-collapse: collapse; width: 100%; font-size: .85rem; margin: .4rem 0 0; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .18rem .4rem; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); }
  details { margin-top: .6rem; }
  summary { cursor: pointer; font-size: .9rem; font-weight: 600; }
  .note { font-size: .78rem; color: var(--muted); margin: .4rem 0 0; }
  .tip { position: absolute; z-index: 2; pointer-events: none; background: var(--fg); color: var(--bg); font-size: .78rem;
         padding: .3rem .5rem; border-radius: 4px; white-space: nowrap; display: none; transform: translate(-50%, -115%); }
  @media (max-width: 480px) { .sliders { grid-template-columns: 4.4rem 1fr 4rem; } body { font-size: 14px; } }
</style>
</head>
<body>
<div class="row presets" id="presets" aria-label="Presets"></div>
<div class="row">
  <fieldset class="seg" id="level"><legend>Boss level</legend></fieldset>
</div>

<div class="bar-wrap">
  <div class="lane"><span class="lane-label">sheet</span><div class="bar sheet" id="sheetbar" role="img" aria-label="What the character sheet shows"></div></div>
  <div class="lane"><span class="lane-label">ruler</span><div class="bar" id="bar" role="img" aria-label="The ruler"></div></div>
  <div class="lane"><span class="lane-label"></span><div class="axis" id="axis"></div></div>
  <div class="tip" id="tip"></div>
</div>
<p class="readout" id="readout"></p>

<div class="sliders" id="sliders"></div>

<table id="table" aria-label="Intervals on the ruler"></table>
<details>
  <summary>Marginal value of one more point</summary>
  <table id="marg"></table>
  <p class="note">Damage counted in ordinary hits, a normal hit being 1: crit <span id="k-crit"></span>, crushing blow <span id="k-crush"></span>, blocked hit <span id="k-block"></span>, avoided swing 0.</p>
</details>

<script>
// ---- every constant lives here ------------------------------------------------
// "sheet" values are what the character sheet shows (against an equal-level attacker).
// "actual" values are what a higher-level boss sees after the level penalty.
const C = {
  baseMiss: 5.0,          // boss miss chance vs an equal-level target, before defence. [confirmed by the author?]
  baseCrit: 5.0,          // boss crit chance vs an equal-level target.
  perLevelAvoid: 0.2,     // each of miss/dodge/parry/block loses this per boss level above you (0.04 per skill point, 5 points per level). [inferred]
  perLevelCrit: 0.2,      // boss crit gains this per level above you. [inferred]
  crushPerSkill: 2.0,     // crushing chance = crushPerSkill * (skill - defence) - crushOffset, floored at 0  →  15% at +3 levels. [inferred]
  crushOffset: 15.0,
  baseDefence: 300,       // your defence skill at level 60 with nothing on.
  critPerDefence: 0.04,   // boss crit removed per defence point above baseDefence (uncrittable at 440 vs a +3 boss). [inferred]
  avoidPerDefence: 0.04,  // each defence point above baseDefence also adds this to miss, dodge, parry and block. The sliders are sheet values, which already include it, so changing defence moves the sliders. [inferred]
  skillPerLevel: 5,
  // Damage multipliers for the "expected damage" column. A blocked boss hit still does most of its damage. [inferred]
  dmg: { hit: 1.0, crit: 2.0, crush: 1.5, block: 0.9, miss: 0, dodge: 0, parry: 0 },
  // Table order and truncation order: rows are filled from the top; whatever does not fit at the bottom is cut.
  // Crit above crush is the wiki / Elitist Jerks model (hit is cut first, then crush, then crit). Not verified from Classic logs. [inferred]
  order: ['miss', 'dodge', 'parry', 'block', 'crit', 'crush', 'hit'],
  names: { miss: 'Miss', dodge: 'Dodge', parry: 'Parry', block: 'Block', crit: 'Crit', crush: 'Crush', hit: 'Ordinary' },
  sliders: [ // sheet values the reader controls
    { k: 'miss',  label: 'Miss',  min: 0, max: 20,  step: 0.1 },
    { k: 'dodge', label: 'Dodge', min: 0, max: 60,  step: 0.1 },
    { k: 'parry', label: 'Parry', min: 0, max: 60,  step: 0.1 },
    { k: 'block', label: 'Block', min: 0, max: 100, step: 0.1 },
  ],
  presets: [ // illustrative gear states; L = boss levels above you, def = defence skill; Shield Block adds 75 to block
    { name: 'Dungeon gear, same-level mob', m: 5,   d: 8,  p: 5, b: 5,  L: 0, def: 300 },
    { name: 'Same gear, raid boss',        m: 5,   d: 8,  p: 5, b: 5,  L: 3, def: 300 },
    { name: 'Raid tank, Shield Block down', m: 10.6, d: 14, p: 12, b: 18, L: 3, def: 440 },   // 54.6; miss = 5 + 0.04 × 140
    { name: 'Raid tank, Shield Block up',   m: 10.6, d: 14, p: 12, b: 93, L: 3, def: 440 },   // 129.6, deep over the edge
    { name: 'Fresh 60, Shield Block up, a hair short', m: 10.6, d: 8, p: 6.3, b: 77, L: 3, def: 440 },  // 2 + 75 block; 101.9
    { name: 'Fresh 60, one point of dodge more',       m: 10.6, d: 9, p: 6.3, b: 77, L: 3, def: 440 },  // 102.9
    { name: 'Raid paladin, Holy Shield up',            m: 10.6, d: 14, p: 12, b: 48, L: 3, def: 440 },  // 18 + 30; 84.6
    { name: 'Raid paladin, Holy Shield + Redoubt',     m: 10.6, d: 14, p: 12, b: 68, L: 3, def: 440 },  // 18 + 30 + 20; 104.6
  ],
  levels: [ { v: 0, label: 'same level' }, { v: 3, label: 'raid boss (+3)' } ],
};
// -------------------------------------------------------------------------------

const S = { miss: 10.6, dodge: 14, parry: 12, block: 18, L: 3, def: 440, rule: 'one' };   // default: the raid tank preset, so the 102.4 line shows on load // rule is fixed: the real one-roll table. A version with pro rata and independent rolls is kept in backup/.
const $ = id => document.getElementById(id);
const r1 = x => Math.round(x * 10) / 10;
const fmt = x => (Math.round(x * 10) / 10).toFixed(1);

// Actual per-row claims a boss L levels above you makes on the 100-point roll.
function claims(s) {
  const pen = C.perLevelAvoid * s.L;
  const skillDiff = C.skillPerLevel * s.L;
  const c = {};
  for (const k of ['miss', 'dodge', 'parry', 'block']) c[k] = Math.max(0, s[k] - pen);
  c.crit = Math.max(0, C.baseCrit + C.perLevelCrit * s.L - C.critPerDefence * (s.def - C.baseDefence));
  c.crush = Math.max(0, C.crushPerSkill * skillDiff - C.crushOffset);
  return c;
}

// Resolve claims into probabilities under a rule. Returns { paid: {k: prob}, unpaid: {k: claim - prob} }.
function resolve(c, rule) {
  const rows = C.order.filter(k => k !== 'hit');
  const paid = {}, unpaid = {};
  if (rule === 'one') {               // priority: fill from the top, cut what does not fit
    let cum = 0;
    for (const k of rows) { paid[k] = Math.max(0, Math.min(c[k], 100 - cum)); unpaid[k] = c[k] - paid[k]; cum += paid[k]; }
  } else if (rule === 'prorata') {    // every claim shrinks by the same factor if they overflow
    const sum = rows.reduce((a, k) => a + c[k], 0);
    const f = sum > 100 ? 100 / sum : 1;
    for (const k of rows) { paid[k] = c[k] * f; unpaid[k] = c[k] - paid[k]; }
  } else {                            // independent rolls in table order: later rows only see what earlier ones left
    let left = 1;
    for (const k of rows) { paid[k] = left * c[k]; unpaid[k] = c[k] - paid[k]; left *= (1 - c[k] / 100); }
  }
  paid.hit = Math.max(0, 100 - rows.reduce((a, k) => a + paid[k], 0));
  unpaid.hit = 0;
  return { paid, unpaid };
}

function expectedDamage(paid) { return C.order.reduce((a, k) => a + paid[k] / 100 * C.dmg[k], 0); }

// Sheet-point sum of the four avoidance rows needed so that crush is fully cut under the one-roll rule.
function threshold(s) {
  const c = claims(s);
  return 100 - c.crit + 4 * C.perLevelAvoid * s.L; // crit sits above crush in the table and fills it too
}

function render() {
  const c = claims(S), { paid, unpaid } = resolve(c, S.rule);
  const fourSheet = S.miss + S.dodge + S.parry + S.block;
  const total = C.order.reduce((a, k) => a + paid[k] + unpaid[k], 0);
  const sheetSum = S.miss + S.dodge + S.parry + S.block;
  const scale = Math.max(112, sheetSum + 6, threshold(S) + 6);
  const pct = v => (v / scale * 100) + '%';
  const gap = 2; // px surface gap between fills
  const bar = $('bar'); bar.innerHTML = '';
  const barW = bar.clientWidth || 600;
  // the sheet lane: the four avoidance rows at the values the character sheet shows, which can run past 100
  const sb = $('sheetbar'); sb.innerHTML = '';
  { let sx = 0;
    for (const k of ['miss', 'dodge', 'parry', 'block']) {
      const w = S[k]; if (w <= 0) continue;
      const el = document.createElement('div'); el.className = 'segm paid';
      el.style.left = `calc(${pct(sx)} + ${gap / 2}px)`; el.style.width = `calc(${pct(w)} - ${gap}px)`;
      el.style.background = `var(--${k})`; el.style.color = `var(--ink-on-${k})`;
      const px = w / scale * barW; el.innerHTML = px >= 54 ? `<b>${C.names[k]}</b> ${fmt(w)}` : px >= 30 ? fmt(w) : '';
      el.dataset.tip = `${C.names[k]} on the sheet: ${fmt(w)}`; el.setAttribute('aria-label', el.dataset.tip); el.tabIndex = 0;
      sb.appendChild(el); sx += w;
    }
    if (c.crush > 0) {
      const t = threshold(S);
      const m = document.createElement('div'); m.className = 'mark thr'; m.style.left = pct(t); sb.appendChild(m);
      const l = document.createElement('div'); l.className = `mark-label above thr ${t / scale > 0.55 ? 'left' : 'right'}`; l.style.left = pct(t);
      l.textContent = `${fmt(t)} on the sheet makes you uncrushable`; sb.appendChild(l);
    }
  }
  const track = document.createElement('div'); track.className = 'track'; track.style.width = `${100 / scale * 100}%`; bar.appendChild(track);
  let x = 0;
  const place = (k, w, cls, title) => {
    if (w <= 0) return;
    const el = document.createElement('div');
    el.className = 'segm ' + cls;
    el.style.left = `calc(${pct(x)} + ${gap / 2}px)`;
    el.style.width = `calc(${pct(w)} - ${gap}px)`;
    el.style.background = `var(--${k})`;
    el.style.color = `var(--ink-on-${k})`;
    el.dataset.tip = title;
    const px = w / scale * barW;
    el.innerHTML = px >= 64 ? `<b>${C.names[k]}</b> ${fmt(w)}` : px >= 46 ? `<b>${C.names[k]}</b>` : '';
    el.setAttribute('aria-label', title);
    el.tabIndex = 0;
    bar.appendChild(el);
    x += w;
  };
  for (const k of C.order) place(k, paid[k], 'paid', `${C.names[k]}: ${fmt(paid[k])}% of swings (inside the ruler)`);
  // marks
  // axis ticks
  const ax = $('axis'); ax.innerHTML = '';
  for (let v = 0; v <= 100; v += 25) { const t = document.createElement('div'); t.className = 'tick'; t.style.left = pct(v); t.innerHTML = `<span>${v}</span>`; ax.appendChild(t); }
  // readout
  const need = threshold(S) - fourSheet;
  let txt = `Sheet: miss + dodge + parry + block = <strong>${fmt(fourSheet)}</strong>. `;
  txt += `Against this boss that is ${fmt(c.miss + c.dodge + c.parry + c.block)} of the 100-point roll. `;
  if (c.crush === 0) txt += `A same-level mob has no crushing blow to begin with.`;
  else txt += need > 0
    ? `Crush still lands on <strong>${fmt(paid.crush)}%</strong> of swings; <strong>${fmt(need)}</strong> more sheet points push it off.`
    : `Crush is off the ruler (${fmt(-need)} points to spare).`;
  $('readout').innerHTML = txt;
  // table
  let h = '<tr><th>Interval</th><th>Sheet</th><th>Length</th><th>Inside the ruler</th><th>Past the edge</th></tr>';
  for (const k of C.order) {
    const sheet = k in S ? fmt(S[k]) : '';
    h += `<tr><td><span class="sw" style="background:var(--${k});display:inline-block;margin-right:.35rem"></span>${C.names[k]}</td><td>${sheet}</td><td>${k === 'hit' ? 'what is left' : fmt(paid[k] + unpaid[k])}</td><td>${fmt(paid[k])}</td><td>${unpaid[k] > 0.049 ? fmt(unpaid[k]) : '–'}</td></tr>`;
  }
  $('table').innerHTML = h;
  // marginal values of +1 sheet point
  const base = expectedDamage(paid);
  let m = '<tr><th>+1 point of</th><th>Δ crush</th><th>Δ crit</th><th>Δ hit</th><th>Δ damage per 100 swings, in ordinary hits</th></tr>';
  for (const sl of C.sliders) {
    const s2 = { ...S, [sl.k]: S[sl.k] + 1 };
    const p2 = resolve(claims(s2), S.rule).paid;
    const dd = (expectedDamage(p2) - base) * 100;
    m += `<tr><td>${sl.label}</td><td>${fmt(p2.crush - paid.crush)}</td><td>${fmt(p2.crit - paid.crit)}</td><td>${fmt(p2.hit - paid.hit)}</td><td>${dd > 0 ? '+' : ''}${fmt(dd)}</td></tr>`;
  }
  { // defence, scaled so the row is comparable: enough skill to move every chance by one point
    const step = Math.round(1 / C.critPerDefence);
    const bump = step * C.avoidPerDefence;
    const s2 = { ...S, def: S.def + step, miss: S.miss + bump, dodge: S.dodge + bump, parry: S.parry + bump, block: S.block + bump };
    const p2 = resolve(claims(s2), S.rule).paid;
    const dd = (expectedDamage(p2) - base) * 100;
    m += `<tr><td>Defence +${step} (+1 to each of the four, −1 crit)</td><td>${fmt(p2.crush - paid.crush)}</td><td>${fmt(p2.crit - paid.crit)}</td><td>${fmt(p2.hit - paid.hit)}</td><td>${dd > 0 ? '+' : ''}${fmt(dd)}</td></tr>`;
  }
  $('marg').innerHTML = m;
  // sync controls and hash
  for (const sl of C.sliders) { $('r-' + sl.k).value = S[sl.k]; $('o-' + sl.k).value = fmt(S[sl.k]); }
  $('def').value = S.def;
  document.querySelector(`#level input[value="${S.L}"]`).checked = true;
  const hash = `m=${S.miss}&d=${S.dodge}&p=${S.parry}&b=${S.block}&L=${S.L}&def=${S.def}`;
  history.replaceState(null, '', '#' + hash);
}

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const num = (k, lo, hi, cur) => { const v = parseFloat(q.get(k)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : cur; };
  S.miss = num('m', 0, 20, S.miss); S.dodge = num('d', 0, 60, S.dodge); S.parry = num('p', 0, 60, S.parry); S.block = num('b', 0, 100, S.block);
  S.L = C.levels.some(l => l.v === num('L', 0, 3, S.L)) ? num('L', 0, 3, S.L) : S.L;
  S.def = num('def', 300, 500, S.def);
}

function build() {
  const pr = $('presets');
  for (const p of C.presets) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = p.name;
    b.onclick = () => { Object.assign(S, { miss: p.m, dodge: p.d, parry: p.p, block: p.b, L: p.L, def: p.def }); render(); };
    pr.appendChild(b);
  }
  const seg = (el, name, opts, onpick) => {
    for (const o of opts) {
      const l = document.createElement('label');
      l.innerHTML = `<input type="radio" name="${name}" value="${o.v}"><span>${o.label}</span>`;
      l.querySelector('input').onchange = () => { onpick(o.v); render(); };
      el.appendChild(l);
    }
  };
  seg($('level'), 'L', C.levels, v => S.L = v);
  const sl = $('sliders');
  for (const s of C.sliders) {
    sl.insertAdjacentHTML('beforeend',
      `<label for="r-${s.k}"><span class="sw" style="background:var(--${s.k})"></span>${s.label}</label>
       <input type="range" id="r-${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" aria-label="${s.label}, sheet value">
       <output id="o-${s.k}" for="r-${s.k}"></output>`);
    $('r-' + s.k).oninput = e => { S[s.k] = r1(parseFloat(e.target.value)); render(); };
  }
  sl.insertAdjacentHTML('beforeend',
    `<label for="def">Defence</label><span style="font-size:.78rem;color:var(--muted)">skill, ${C.baseDefence} base; each point is +0.04 to the four and −0.04 boss crit</span>
     <input type="number" id="def" min="300" max="500" step="1" aria-label="Defence skill">`);
  $('def').onchange = e => {
    const nd = Math.min(500, Math.max(300, parseInt(e.target.value) || C.baseDefence));
    const delta = (nd - S.def) * C.avoidPerDefence;   // the game adds this to each of the four sheet values
    for (const k of ['miss', 'dodge', 'parry', 'block']) S[k] = r1(Math.max(0, S[k] + delta));
    S.def = nd; render();
  };
  $('k-crit').textContent = C.dmg.crit; $('k-crush').textContent = C.dmg.crush; $('k-block').textContent = C.dmg.block;
  // tooltips
  const tip = $('tip'), wrap = tip.parentElement;
  const show = el => { tip.textContent = el.dataset.tip; tip.style.display = 'block'; const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect(); tip.style.left = (r.left - w.left + r.width / 2) + 'px'; tip.style.top = (r.top - w.top) + 'px'; };
  for (const id of ['bar', 'sheetbar']) {
    $(id).addEventListener('mouseover', e => { const el = e.target.closest('.segm'); if (el) show(el); });
    $(id).addEventListener('focusin', e => { const el = e.target.closest('.segm'); if (el) show(el); });
    $(id).addEventListener('mouseleave', () => tip.style.display = 'none');
    $(id).addEventListener('focusout', () => tip.style.display = 'none');
  }
  window.addEventListener('hashchange', () => { readHash(); render(); });
  window.addEventListener('resize', render);
}

build(); readHash(); render();

// Tell the post page how tall this figure is, so the iframe fits it (no fixed height, no inner scrollbar).
(function () {
  if (window.parent === window) return;
  const report = () => parent.postMessage({ hfHeight: document.body.getBoundingClientRect().height }, '*');
  new ResizeObserver(report).observe(document.body);
  addEventListener('load', report);
})();
</script>
</body>
</html>
